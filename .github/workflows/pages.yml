name: Build and deploy engineering portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate website files
        run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build pages and search index
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - name: Validate generated links and search entries
        run: npm run validate
      - name: Verify Chinese and English search
        run: npm run test:search
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
