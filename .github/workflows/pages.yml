name: Deploy personal page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate website files
        run: |
          node --check app.js
          node --check profile.js
          python3 scripts/validate-site.py
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html style.css app.js profile.js favicon.svg .nojekyll _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
